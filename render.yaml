# Free plan: no disk. DATABASE_URL (Neon) is REQUIRED or all data resets on every restart.
# Uploaded ID photos and the student login list are temporary on this plan.
services:
  - type: web
    name: ema-clearance
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login/
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: DEBUG, value: "0"}
      - {key: WEB_CONCURRENCY, value: "1"}
      - {key: DATABASE_URL, sync: false}
      - {key: REGISTRAR_PASSWORD, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: STUDENTS_CSV, value: /app/data/students.csv}
