{% if page.has_other_pages %}<div class="row" style="justify-content:center;align-items:center;margin-top:14px">{% if page.has_previous %}<a class="btn no" href="?{{ qstr }}&page={{ page.previous_page_number }}">← Previous</a>{% endif %}<span class="m small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn no" href="?{{ qstr }}&page={{ page.next_page_number }}">Next →</a>{% endif %}</div>{% endif %}
