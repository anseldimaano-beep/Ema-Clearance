# Render Blueprint (paid "starter" plan: needs the persistent disk for uploads + login list).
# Free plan instead? Use render.free.yaml (uploads are lost on restart; requires a Neon DATABASE_URL).
services:
  - type: web
    name: ema-clearance
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /login/
    envVars:
      - {key: SECRET_KEY, generateValue: true}
      - {key: DEBUG, value: "0"}
      - {key: WEB_CONCURRENCY, value: "2"}
      - {key: DATABASE_URL, sync: false}        # optional: Neon URL. Empty = SQLite on the disk
      - {key: REGISTRAR_PASSWORD, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
      - {key: STUDENTS_CSV, value: /app/data/students.csv}
      - {key: DATA_DIR, value: /data}
    disk: {name: data, mountPath: /data, sizeGB: 1}
